# ktor-poc: everything that runs on the single k3s node.
# prerequisites (scripts/bootstrap-k3s.sh): k3s, envoy gateway v1.9.2 + gateway api crds,
# the ktor-poc-tls secret, and the ktor-poc:0.1.0 image imported into containerd.
#
# every pod is Burstable (requests < limits) so kubelet LimitedSwap lets it spill into swap.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ktor-poc
---
# placeholder credentials; change POSTGRES_PASSWORD before the first deploy (postgres keeps the first one it sees)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ktor-poc
type: Opaque
stringData:
  POSTGRES_DB: ktor
  POSTGRES_USER: ktor
  POSTGRES_PASSWORD: change-me-please
---
# ---------------------------------------------------------------------------
# postgres
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ktor-poc
  labels:
    app: postgres
spec:
  replicas: 1
  # one writer on a hostPath volume: never run two pods at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          args:
            - postgres
            - -c
            - shared_buffers=32MB
            - -c
            - effective_cache_size=128MB
            - -c
            - work_mem=2MB
            - -c
            - maintenance_work_mem=16MB
            - -c
            - max_connections=20
            - -c
            - wal_buffers=1MB
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            # postgres 18 images keep PGDATA at /var/lib/postgresql/18/docker, so mount the parent
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          hostPath:
            path: /var/lib/ktor-poc/postgres
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ktor-poc
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# ---------------------------------------------------------------------------
# ktor
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ktor
  namespace: ktor-poc
  labels:
    app: ktor
spec:
  replicas: 1
  # two jvms do not fit in 1 GB, so no surge during rollouts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ktor
  template:
    metadata:
      labels:
        app: ktor
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: ktor
          # side-loaded into containerd by scripts/deploy.sh, never pulled
          image: ktor-poc:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            # heap + metaspace + code cache + direct buffers + stacks stay under the 512Mi limit
            - name: JAVA_OPTS
              value: >-
                -Xms64m -Xmx320m
                -XX:+UseSerialGC
                -XX:MaxMetaspaceSize=96m
                -XX:ReservedCodeCacheSize=32m
                -XX:MaxDirectMemorySize=32m
                -Xss512k
                -XX:TieredStopAtLevel=1
                -XX:-UsePerfData
                -XX:+ExitOnOutOfMemoryError
            - name: PORT
              value: "8080"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/ktor
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          # a throttled t3 can take minutes to start a jvm; allow up to 5 min
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ktor
  namespace: ktor-poc
spec:
  selector:
    app: ktor
  ports:
    - name: http
      port: 80
      targetPort: http
---
# ---------------------------------------------------------------------------
# gateway api (envoy gateway) bound straight to the host's ports 80/443
# ---------------------------------------------------------------------------
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: ktor-poc-proxy
  namespace: ktor-poc
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # bind 80/443 as-is instead of shifting to 10080/10443; the node sysctl
      # net.ipv4.ip_unprivileged_port_start=0 lets the non-root envoy do this
      useListenerPortAsContainerPort: true
      # ClusterIP: no LoadBalancer service, so nothing for any controller to provision
      envoyService:
        type: ClusterIP
      envoyDeployment:
        replicas: 1
        # host ports cannot be held by two pods, so no rolling surge
        strategy:
          type: Recreate
        container:
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  hostNetwork: true
                  dnsPolicy: ClusterFirstWithHostNet
                  containers:
                    - name: shutdown-manager
                      resources:
                        requests:
                          cpu: 5m
                          memory: 16Mi
                        limits:
                          memory: 32Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ktor-gateway
  namespace: ktor-poc
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: ktor-poc-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          # self-signed, created by scripts/bootstrap-k3s.sh
          - kind: Secret
            name: ktor-poc-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ktor-route
  namespace: ktor-poc
spec:
  parentRefs:
    - name: ktor-gateway
  rules:
    # websockets: envoy gateway upgrades by default; disable the route timeout so long-lived sessions are not cut
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      timeouts:
        request: "0s"
      backendRefs:
        - name: ktor
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ktor
          port: 80
---
# keep idle websocket streams open for an hour (default stream idle is 5 min); ktor's 15s pings keep them active anyway
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: ktor-client-timeouts
  namespace: ktor-poc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ktor-gateway
  timeout:
    http:
      idleTimeout: 1h
      streamIdleTimeout: 1h
